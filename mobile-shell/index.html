<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08150f" />
    <title>Kim Lân</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #08150f;
        color: #f7e8b2;
      }
      main {
        width: min(100%, 440px);
        padding: 28px;
        border: 1px solid #916f31;
        border-radius: 20px;
        background: #10271d;
        box-shadow: 0 20px 60px #0008;
      }
      h1 {
        margin: 0 0 12px;
        color: #f2c45c;
      }
      p {
        line-height: 1.6;
        color: #d6cfbb;
      }
      code {
        color: #fff0b8;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kim Lân</h1>
      <p>APK đã hoạt động, nhưng chưa được gắn địa chỉ máy chủ game.</p>
      <p>
        Trong GitHub, tạo biến <code>KINGVIN_SERVER_URL</code> bằng địa chỉ HTTPS của website game
        rồi chạy lại workflow <strong>Build Android APK</strong>.
      </p>
    </main>
  </body>
</html>
